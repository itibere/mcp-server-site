name: Purge Cloudflare cache

on:
  page_build:
  workflow_dispatch:

jobs:
  purge:
    if: github.event_name == 'workflow_dispatch' || github.event.build.result == 'built'
    runs-on: ubuntu-latest
    steps:
      - name: Purge everything
        run: |
          curl -sSf -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
